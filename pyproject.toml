[project]
name = "stripe-crm-automation"
version = "0.1.0"
description = "Stripe payments to HubSpot CRM, emails and Slack alerts, with verified webhooks, idempotency and retries"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Zohaib Tariq" }]
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "stripe>=10", "httpx>=0.27", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["stripe_automation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
